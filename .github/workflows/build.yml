# Builds and tests the application on every push to main and every pull request.
# A "v…" tag additionally triggers publishing the self-contained executable and creating the
# GitHub release that carries it.

name: build

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:

  test:
    name: Tests
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      # This pass is the one that counts. It runs uninstrumented: compact mode promises an answer
      # in under a second, and that budget can only be checked on uninstrumented code.
      - name: Test
        run: dotnet test --no-build -c Release --logger "trx;LogFileName=results.trx" --results-directory TestResults

      # Second pass, for measurement only. The timing-budget test is excluded from it: under
      # instrumentation it times the coverage counter rather than the application, and fails
      # intermittently depending on how loaded the machine is.
      - name: Collect coverage
        run: dotnet test --no-build -c Release --collect:"XPlat Code Coverage" --filter "FullyQualifiedName!~AnswersInUnderASecond" --results-directory TestResults

      # The three test projects each produce their own report; they must be merged to get the real
      # coverage, otherwise one reads three partial figures, none of which is true.
      - name: Coverage report
        if: always()
        run: |
          dotnet tool install dotnet-reportgenerator-globaltool --tool-path ./rgtool
          ./rgtool/reportgenerator -reports:"TestResults/**/coverage.cobertura.xml" -targetdir:coverage -reporttypes:"MarkdownSummaryGithub;Html"
          Get-Content coverage/SummaryGithub.md >> $env:GITHUB_STEP_SUMMARY

      - name: Upload test results and coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            TestResults
            coverage
          if-no-files-found: ignore

  release:
    name: Release
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # The win-x64 profile produces a single self-contained executable: no .NET to install on the
      # target machine. It writes to publish/win-x64/ (a path set by the profile itself).
      - name: Publish
        run: dotnet publish src/PokerRanges.App/PokerRanges.App.csproj -p:PublishProfile=win-x64 --nologo

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$env:GITHUB_REF_NAME" "publish/win-x64/PokerRanges.exe" --title "PokerRanges $env:GITHUB_REF_NAME" --generate-notes
